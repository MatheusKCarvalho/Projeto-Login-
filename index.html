<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="mensagemLogin"></p>
    <div id="perfilUsuario">

        <h1>Perfil</h1>
        <p id="perfilNome"></p>
        <p id="perfilEmail"></p>
        <button id="btnPerfil" class="btn">Perfil</button>

    </div>
    <input id="inputNovoNome" type="text" placeholder="Insira seu novo nome">
    <button id="btnSalvaNome" class="btn">Salvar Nome</button>
    <button id="btnLogin" class="btn">Login</button>
    <div id="popupLogin" class="popup">
        <div class="popupLogin">
            <h2>Login</h2>
            <button class="btn-fechar" id="sairLogin">X</button>
            <input id="inputUsuario" type="text" placeholder="User">
            <div class="campo-senha">
                <input id="inputSenha" type="password" placeholder="Password">
                <button class="btn-senha" id="verSenha">👁️</button>
            </div>
            <button class="btn-entrar" id="entrar">Entrar</button>
        </div>
    </div>
    <input id="inputNovaSenha" type="text" placeholder="Insira sua nova senha">
    <button id="btnSalvaSenha" class="btn">Salvar Senha</button>
    <button id="deletarConta" class="btn">Deletar Conta</button>
    <button id="btnSair" class="btn">Sair</button>
    <button id="btnSing" class="btn">Sign up</button>
    <div id="popupSingUp" class="popup">
        <div>
            <p id="mensagemSing"></p>
            <h2>Sign up</h2>
            <button class="btn-fechar" id="sairSing">X</button>
            <input id="inputEmail" type="email" placeholder="Email">
            <input id="inputUser" type="text" placeholder="User">
        <div class="campo-senha">
            <input id="inputPassword" type="password" placeholder="Password">
            <button class="btn-senha" id="verSenhaCadastro">👁️</button>
        </div>
            <button id="criarUser">Criar</button>
        </div>
    </div>
    <input id="inputPost" type="text" placeholder="Escreva algo">
    <p id="contadorCaracteres">0/200</p>
    <button id="btnPostar" class="btn">Postar</button>
    <input id="inputPesquisar" type="text" placeholder="Pesquisar posts...">
    <button id="btnRecentes" class="btn">Mais recentes</button>
    <button id="btnCurtidos" class="btn">Mais curtidos</button>
    <div id="listaPosts"></div>
    
    <button id="btnTema">🌙 Tema Escuro</button>
    <script src="script.js"></script>
</body>
</html>
